name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || (echo "Run gofmt"; exit 1)

  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use Cachix
        uses: cachix/cachix-action@v17
        with:
          name: mcp-openrouter-search
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Check flake
        run: nix flake check

      - name: Build Nix package
        id: build-nix-package
        run: |
          store_path=$(nix build --no-link --print-build-logs --print-out-paths .#packages.x86_64-linux.default)
          echo "store_path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Push package output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cachix push mcp-openrouter-search '${{ steps.build-nix-package.outputs.store_path }}'

      - name: Pin latest package output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cachix pin mcp-openrouter-search mcp-openrouter-search-latest '${{ steps.build-nix-package.outputs.store_path }}' --keep-revisions 1
